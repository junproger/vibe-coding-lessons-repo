<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор сложения</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #0b1220;
            --card: rgba(255, 255, 255, 0.08);
            --stroke: rgba(255, 255, 255, 0.14);
            --text: rgba(255, 255, 255, 0.92);
            --muted: rgba(255, 255, 255, 0.70);
            --accent: #7c3aed;
            --accent2: #22c55e;
            --danger: #ef4444;
            --shadow: 0 18px 55px rgba(0, 0, 0, 0.45);
            --radius: 16px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
            background:
                radial-gradient(1000px 600px at 20% 10%, rgba(124, 58, 237, 0.35), transparent 60%),
                radial-gradient(900px 600px at 90% 40%, rgba(34, 197, 94, 0.25), transparent 55%),
                radial-gradient(900px 800px at 40% 100%, rgba(59, 130, 246, 0.18), transparent 55%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .app {
            width: min(720px, 100%);
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            padding: 22px;
        }

        .header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .title {
            font-size: 18px;
            margin: 0;
            letter-spacing: 0.2px;
        }

        .hint {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(0, 0, 0, 0.18);
            color: var(--text);
            outline: none;
        }

        input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.45); }

        input[type="text"]:focus {
            border-color: rgba(124, 58, 237, 0.65);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.18);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        button {
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        button:focus-visible {
            outline: 3px solid rgba(124, 58, 237, 0.35);
            outline-offset: 2px;
        }

        .btn-primary {
            border-color: rgba(124, 58, 237, 0.45);
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.85), rgba(124, 58, 237, 0.35));
        }

        .btn-ghost {
            border-color: rgba(255, 255, 255, 0.16);
            background: rgba(0, 0, 0, 0.16);
        }

        .result {
            margin-top: 16px;
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.22);
            background: rgba(0, 0, 0, 0.12);
            padding: 12px 12px;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result strong { font-weight: 800; }
        .result .msg { color: var(--muted); }
        .result.error .msg { color: rgba(239, 68, 68, 0.95); font-weight: 700; }

        @media (max-width: 560px) {
            .grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <main class="app" role="application" aria-label="Калькулятор сложения">
        <div class="header">
            <h1 class="title">Калькулятор: сложение двух чисел</h1>
            <p class="hint">Например: 2 + 3 = 5</p>
        </div>

        <form id="calcForm" autocomplete="off" novalidate>
            <div class="grid">
                <div>
                    <label for="a">Число A</label>
                    <input id="a" name="a" type="text" inputmode="decimal" placeholder="Введите число A" value="">
                </div>
                <div>
                    <label for="b">Число B</label>
                    <input id="b" name="b" type="text" inputmode="decimal" placeholder="Введите число B" value="">
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" id="addBtn" type="submit">Сложить</button>
                <button class="btn-ghost" id="clearBtn" type="button">Очистить</button>
            </div>

            <div id="result" class="result" aria-live="polite" aria-atomic="true">
                <span class="msg">Результат появится здесь</span>
            </div>
        </form>
    </main>

    <script>
        const aEl = document.getElementById('a');
        const bEl = document.getElementById('b');
        const formEl = document.getElementById('calcForm');
        const clearBtn = document.getElementById('clearBtn');
        const resultEl = document.getElementById('result');

        function parseUserNumber(raw) {
            const s = String(raw ?? '').trim();
            if (!s) return null;
            const normalized = s.replace(',', '.');
            const n = Number(normalized);
            return Number.isFinite(n) ? n : null;
        }

        function setResult(text, isError) {
            resultEl.classList.toggle('error', Boolean(isError));
            resultEl.innerHTML = '<span class="msg"></span>';
            resultEl.querySelector('.msg').textContent = text;
        }

        function showSum() {
            const a = parseUserNumber(aEl.value);
            const b = parseUserNumber(bEl.value);

            if (a === null || b === null) {
                setResult('Введите два числа', true);
                return;
            }

            const sum = a + b;
            setResult(`Результат: ${sum}`, false);
        }

        function clearAll() {
            aEl.value = '';
            bEl.value = '';
            resultEl.classList.remove('error');
            setResult('Результат появится здесь', false);
            aEl.focus();
        }

        formEl.addEventListener('submit', (e) => {
            e.preventDefault();
            showSum();
        });

        clearBtn.addEventListener('click', () => {
            clearAll();
        });

        [aEl, bEl].forEach((el) => {
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') clearAll();
            });
        });
    </script>
</body>
</html>
